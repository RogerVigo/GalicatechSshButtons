<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SSH Buttons</title>
  <style>
    :root {
      --bg: #f6fbf7;
      --surface: #ffffff;
      --text: #171d1a;
      --muted: #52605a;
      --primary: #006b56;
      --border: #dce5df;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1512;
        --surface: #151d19;
        --text: #dee4df;
        --muted: #b2bdb6;
        --primary: #72dbb7;
        --border: #37433d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(560px, 100%);
      padding: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
    }
    .icon {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: #0c2a24;
      color: #7ee2b8;
      font: 700 42px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    h1 { margin: 20px 0 6px; color: var(--primary); }
    p { margin: 10px 0; }
    .muted { color: var(--muted); }
    a { color: var(--primary); }
    footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <div class="icon">&gt;_</div>
    <h1>SSH Buttons</h1>
    <p>Save SSH commands as one-tap buttons for the hosts you manage.</p>
    <p class="muted"><code>com.galaicatech.sshbuttons</code></p>
    <footer>
      <a href="privacy-policy.html">Privacy Policy</a>
    </footer>
  </main>
</body>
</html>
